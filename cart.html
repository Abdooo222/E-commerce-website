<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - Kaza</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Your Cart</h1>
</header>

<div class="cart-page" style="max-width:700px; margin:2rem auto; padding:1rem;">
  <h2>Items in Your Cart</h2>
  <div id="cartItemsPage"></div>

  <h2 style="margin-top:2rem;">Total: <span id="cartTotalPage">$0.00</span></h2>

  <button class="checkout-btn" onclick="checkout()">Checkout</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderCartPage() {
  const container = document.getElementById("cartItemsPage");
  container.innerHTML = "";

  let total = 0;

  if (cart.length === 0) {
    container.innerHTML = "<p class='cart-empty'>Your cart is empty.</p>";
    return;
  }

  cart.forEach(item => {
    total += item.price * item.qty;

    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <img src="${item.image}" />
      <div class="cart-info">
        <span>${item.name}</span>
        <span class="cart-price">$${item.price.toFixed(2)}</span>
        <div class="qty-controls">
          <button onclick="changeQty(${item.id}, -1)">-</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${item.id}, 1)">+</button>
        </div>
      </div>
      <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
    `;
    container.appendChild(div);
  });

  document.getElementById("cartTotalPage").textContent = "$" + total.toFixed(2);
}

function changeQty(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;

  item.qty += delta;
  if (item.qty <= 0) {
    cart = cart.filter(i => i.id !== id);
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  renderCartPage();
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCartPage();
}

function checkout() {
  alert("Proceeding to checkout…");
}

renderCartPage();
</script>

</body>
</html>
